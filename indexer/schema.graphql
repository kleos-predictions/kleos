# Kleos indexer schema. Money is raw 6-decimal token units; R, prices and multipliers are raw
# 18-decimal (WAD) values, exactly as the contract emits them. Timestamps are unix seconds.

enum MarketState {
  Open
  Proposed
  Disputed
  Resolved
}

enum CallResult {
  Open
  Right
  Wrong
  Refunded
}

enum ChangeKind {
  Bet # settlement of a position
  Jury # Kleos Court reward or penalty (jurors never hold a position in the market)
  Admin # marketId 0: demo seed or admin slash
}

enum HistorySource {
  Genesis # complete replay starts at deployment; no seed has occurred
  DirectInput # validated top-level seedReputation calldata
  Unknown # an admin event may have reset history through a nested call
}

enum AdminAction {
  Seed
  Slash
  Unknown
}

enum CommitmentSource {
  Genesis
  DirectInput
  Reveal # successful reveal proves nonzero state, but not the commitment bytes
  Unknown
}

enum ConfigurationSource {
  DirectCreation
  PinnedSnapshot
  Unknown
}

enum VestDeadlineSource {
  Genesis
  DirectCreation
  PinnedSnapshot
  Unknown
}

enum OwnerSource {
  DirectCreation
  Event
  Unknown
}

# Only direct creation input whose receipt contractAddress matches the event emitter is used.
# Factory deployments remain explicitly unknown. Envio namespaces this entity by chain.
type ContractConfiguration {
  id: ID! # lowercase Kleos address
  source: ConfigurationSource!
  vestPeriod: BigInt
  nMin: BigInt
  disputeWindow: BigInt
  courtPeriod: BigInt
  blockNumber: Int
  txHash: String
  blockHash: String
  runtimeSha256: String
}

type Category {
  id: ID! # category id
  name: String!
  markets: [Market!]! @derivedFrom(field: "category")
}

type Market {
  id: ID! # marketId
  question: String!
  category: Category!
  creator: String! # the team (free) or a tier-V trader (bond + fee)
  creatorBondForfeited: Boolean # set when a trader's creation bond is released; true if the court ruled the question AMBIGUOUS
  oracle: String!
  criteria: String!
  closeTime: BigInt!
  createdAt: Int!

  state: MarketState!
  outcome: Boolean # set once resolved (not for voided markets)
  voided: Boolean! # refunded: the court ruled AMBIGUOUS, the court failed, or the market expired
  expired: Boolean! # voided because nobody proposed an outcome in time (Kleos.expire)
  resolvedAt: Int
  proposedOutcome: Boolean
  proposer: String
  proposedAt: Int
  evidenceHash: String
  evidenceURI: String
  disputer: String

  yesMoney: BigInt!
  noMoney: BigInt!
  yesEff: BigInt!
  noEff: BigInt!
  priceRepYes: BigInt! # after the latest bet; 0.5 before any
  priceMoneyYes: BigInt!
  betCount: Int!
  bettorCount: Int! # distinct addresses
  callCount: Int!
  sharpYes: Int! # distinct traders who bet YES while their R was at least 16 (tier IV)
  sharpNo: Int!

  courtRound: Int! # 0 until disputed; then the current Kleos Court round (1 or 2)
  verdict: Int # 1 YES, 2 NO, 3 AMBIGUOUS; unset if the court failed

  fee: BigInt! # 2% of the losing pool, set on resolution
  bonusPool: BigInt! # fee + sponsorships + global-pool top-ups; the final pot once bonusOpen
  bonusWeight: BigInt! # Σ ΔR⁺·M of winners, known once bonusOpen. Claimable = bonusPool · Position.bonusWeight / bonusWeight
  sponsored: BigInt! # third-party sponsorships only (not global-pool top-ups)
  lastSponsor: String
  bonusOpen: Boolean!
  rolledOver: BigInt! # bonus sent to the global pool because no winner gained reputation

  bets: [Bet!]! @derivedFrom(field: "market")
  positions: [Position!]! @derivedFrom(field: "market")
  pricePoints: [PricePoint!]! @derivedFrom(field: "market")
  calls: [Call!]! @derivedFrom(field: "market")
  courtRounds: [CourtRound!]! @derivedFrom(field: "market")
}

# One trader's stake in one market, both sides. Id: marketId_address.
type Position {
  id: ID!
  market: Market! @index
  trader: Trader! @index
  yesMoney: BigInt!
  noMoney: BigInt!
  yesEff: BigInt!
  noEff: BigInt!
  settled: Boolean!
  payout: BigInt!
  bonusWeight: BigInt! # ΔR⁺·M from settlement; 0 unless the trader gained reputation here
  bonus: BigInt! # claimed so far
  bonusClaimed: Boolean! # true even when the successful claim paid zero
  sharpYes: Boolean! # counted in Market.sharpYes
  sharpNo: Boolean!
}

type Bet {
  id: ID! # block_logIndex
  market: Market! @index
  trader: Trader! @index
  side: Boolean! # true = YES
  amount: BigInt!
  effective: BigInt!
  multiplier: BigInt!
  entryPrice: BigInt! # rep-weighted price of the chosen side before the bet, clamped to 5–95%
  traderR: BigInt! # the trader's vested R when the bet was placed
  sharp: Boolean! # traderR ≥ 16 (tier IV): counts toward the sharp signal
  timestamp: Int! @index
  txHash: String!
  blockNumber: Int!
  logIndex: Int!
  contractAddress: String!
}

# Both prices right after a bet, for the price chart.
type PricePoint {
  id: ID! # block_logIndex
  market: Market! @index
  timestamp: Int! @index
  priceRepYes: BigInt!
  priceMoneyYes: BigInt!
  blockNumber: Int!
  logIndex: Int!
}

type Trader {
  id: ID! # lowercase address
  name: String # KleosSocial username, unique, 3–20 chars of a–z, 0–9 and _
  followerCount: Int!
  followingCount: Int!
  r: BigInt! # vested reputation
  pending: BigInt! # gains waiting to vest
  resolvedBets: BigInt # exact uint32 history, or null after an unrecoverable nested admin event
  resolvedBetsSource: HistorySource!
  vestAt: BigInt # contract deadline; not cleared by Vested or a loss
  vestAtSource: VestDeadlineSource!
  lastGainAt: Int # last observed deadline-resetting gain
  flagged: Boolean!
  slashed: BigInt! # reputation removed by the admin after review
  isJuror: Boolean! # in the Kleos Court pool
  juryDuties: Int! # times drawn onto a jury
  wins: Int!
  losses: Int!
  betCount: Int!
  volume: BigInt!
  marketCount: Int!
  callCount: Int!
  bets: [Bet!]! @derivedFrom(field: "trader")
  positions: [Position!]! @derivedFrom(field: "trader")
  reputationChanges: [ReputationChange!]! @derivedFrom(field: "trader")
  calls: [Call!]! @derivedFrom(field: "trader")
  juryVotes: [JurorVote!]! @derivedFrom(field: "juror")
  following: [Follow!]! @derivedFrom(field: "follower")
  followers: [Follow!]! @derivedFrom(field: "followee")
  callVotes: [CallVote!]! @derivedFrom(field: "voter")
}

# Every ReputationChanged event, so anyone can rebuild R and check the math.
type ReputationChange {
  id: ID! # block_logIndex
  trader: Trader! @index
  market: Market # unset for Admin changes (marketId 0)
  kind: ChangeKind!
  adminAction: AdminAction # only set for marketId 0
  resolvedBets: BigInt # recovered seed count, when available
  delta: BigInt! # signed
  newR: BigInt!
  pendingR: BigInt!
  entryPrice: BigInt!
  side: Boolean!
  outcome: Boolean!
  timestamp: Int! @index
  txHash: String!
  blockNumber: Int!
  logIndex: Int!
  contractAddress: String!
}

# Complete claim state, including zero claims by an address without a Position.
type BonusClaim {
  id: ID! # marketId_address: one successful claim per user
  market: Market! @index
  trader: Trader! @index
  amount: BigInt!
  eventId: String!
  timestamp: Int!
  txHash: String!
  blockNumber: Int!
  logIndex: Int!
  contractAddress: String!
}

type Vesting {
  id: ID! # block_logIndex
  trader: Trader! @index
  amount: BigInt!
  newR: BigInt!
  timestamp: Int!
  txHash: String!
  blockNumber: Int!
  logIndex: Int!
  contractAddress: String!
}

type Slash {
  id: ID! # block_logIndex; followed by the action's ReputationChanged
  trader: Trader! @index
  amount: BigInt!
  txHash: String!
}

type OwnershipChange {
  id: ID!
  previousOwner: String!
  newOwner: String!
  timestamp: Int!
  txHash: String!
  blockNumber: Int!
  logIndex: Int!
  contractAddress: String!
}

# A public one-line reason posted with a bet. Id = the callId Kleos numbers from 1, which
# KleosSocial votes use too.
type Call {
  id: ID!
  market: Market! @index
  trader: Trader! @index
  side: Boolean!
  amount: BigInt!
  entryPrice: BigInt!
  text: String!
  result: CallResult!
  ups: Int! # KleosSocial votes: engagement only, never money or reputation
  downs: Int!
  timestamp: Int! @index
  txHash: String!
  votes: [CallVote!]! @derivedFrom(field: "call")
}

# KleosSocial: one address following another. Id: follower_followee. Deleted on unfollow.
type Follow {
  id: ID!
  follower: Trader! @index
  followee: Trader! @index
  since: Int!
}

# KleosSocial: one address's vote on one call. Id: callId_voter. Deleted when the vote is cleared.
# KleosSocial doesn't check that the call exists, so `call` resolves only once that id is posted.
type CallVote {
  id: ID!
  call: Call @index
  voter: Trader! @index
  value: Int! # 1 up, -1 down
}

# One Kleos Court round on a disputed market. Id: marketId_round. A round with no verdict either
# leads to a redraw (round 2) or, in the last round, voids the market.
type CourtRound {
  id: ID!
  market: Market! @index
  round: Int!
  jurors: [String!]! # lowercase addresses, as drawn
  drawnAt: Int!
  commits: Int # current nonzero commitments; null if any seat's state is unknown
  commitEvents: Int! # all writes, including replacements and zero cancellations
  reveals: Int!
  yes: Int!
  no: Int!
  ambiguous: Int!
  verdict: Int # 1 YES, 2 NO, 3 AMBIGUOUS, once 3 votes match
  failed: Boolean! # closed without a verdict
  votes: [JurorVote!]! @derivedFrom(field: "round")
}

# One juror's seat in one round. Id: marketId_round_juror. Created when the jury is drawn, so
# no-shows are visible.
type JurorVote {
  id: ID!
  round: CourtRound! @index
  juror: Trader! @index
  committed: Boolean # current nonzero state; null if nested calldata cannot be recovered
  commitment: String # bytes recovered from validated direct commitVote input
  commitmentSource: CommitmentSource!
  vote: Int! # 0 until revealed; then 1 YES, 2 NO, 3 AMBIGUOUS
}

# Totals across the protocol. Envio Cloud has no aggregate queries, so they're kept here. Id: "kleos".
type Protocol {
  id: ID!
  marketCount: Int!
  betCount: Int!
  bettorCount: Int! # distinct addresses that ever bet
  volume: BigInt!
  callCount: Int!
  jurorCount: Int! # current pool size
  revenueAccrued: BigInt! # 1% of losing pools plus creation fees
  revenueWithdrawn: BigInt!
  owner: String # null until observed or recovered from direct creation
  ownerSource: OwnerSource!
}
