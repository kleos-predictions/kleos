# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
name: kleos-indexer
disable_default_cross_chain: true
# Monad testnet. Envio Cloud runs this file.
# Contracts as deployed on 2026-09-30 (contracts/ignition/deployments/chain-10143). The start
# block is KleosSocial's deploy block (67114786); Kleos followed in 67114811. A redeploy of the
# contracts needs the addresses and the start block changed.
chains:
- id: 10143
  start_block: 67114786
  # Read through HyperSync. Envio Cloud gives hosted indexers their own HyperSync access, so no
  # token is set there. Running this file locally needs ENVIO_API_TOKEN in indexer/.env.
  contracts:
  - name: Kleos
    address:
    - "0xd68a1F212fa52663468BBB6F0456Cd6e7Ce854Cb" # quoted: an unquoted hex address can parse as a number
    events:
    - event: BetPlaced(uint256 indexed marketId, address indexed user, bool side, uint256 amount, uint256 effective, uint256 multiplier, uint256 entryPrice, uint256 priceRepYes, uint256 priceMoneyYes)
    - event: BonusClaimed(uint256 indexed marketId, address indexed user, uint256 amount)
    - event: BonusOpened(uint256 indexed marketId, uint256 bonusPool, uint256 totalWeight)
    - event: BonusRolledOver(uint256 indexed marketId, uint256 amount)
    - event: CallPosted(uint256 indexed callId, uint256 indexed marketId, address indexed user, bool side, uint256 amount, uint256 entryPrice, string text)
    - event: CategoryAdded(uint8 indexed id, string name)
    - event: CourtRedrawn(uint256 indexed marketId, uint8 failedRound)
    - event: CreatorBondReleased(uint256 indexed marketId, address indexed creator, uint256 amount, bool forfeited)
    - event: FlagCleared(address indexed user)
    - event: Flagged(address indexed user, uint256 indexed marketId)
    - event: JurorJoined(address indexed juror)
    - event: JurorLeft(address indexed juror)
    - event: JurorPruned(address indexed juror)
    - event: JuryDrawn(uint256 indexed marketId, uint8 round, address[] jurors)
    - event: MarketExpired(uint256 indexed marketId)
    - event: MarketCreated(uint256 indexed marketId, address indexed creator, string question, uint8 category, string oracle, string criteria, uint64 closeTime)
    - event: MarketResolved(uint256 indexed marketId, bool outcome, uint256 fee)
    - event: MarketVoided(uint256 indexed marketId)
    - event: OutcomeDisputed(uint256 indexed marketId, address indexed disputer)
    - event: OutcomeProposed(uint256 indexed marketId, address indexed proposer, bool outcome, bytes32 evidenceHash, string evidenceURI)
    - event: OwnershipTransferred(address indexed previousOwner, address indexed newOwner)
    - event: RevenueAccrued(uint256 indexed marketId, uint256 amount)
    - event: RevenueWithdrawn(address indexed to, uint256 amount)
    - event: ReputationChanged(address indexed user, uint256 indexed marketId, int256 delta, uint256 newR, uint256 pendingR, uint256 entryPrice, bool side, bool outcome)
    - event: Settled(uint256 indexed marketId, address indexed user, uint256 payout, uint256 bonusWeight)
    - event: Slashed(address indexed user, uint256 amount)
    - event: Sponsored(uint256 indexed marketId, address indexed sponsor, uint256 amount)
    - event: Verdict(uint256 indexed marketId, uint8 round, uint8 vote)
    - event: Vested(address indexed user, uint256 amount, uint256 newR)
    - event: VoteCommitted(uint256 indexed marketId, uint8 round, address indexed juror)
    - event: VoteRevealed(uint256 indexed marketId, uint8 round, address indexed juror, uint8 vote)
  - name: KleosSocial
    address:
    - "0x766d184Fc25Fe88d30cF62dC9A391cBb2975B9aA"
    events:
    - event: CallVoted(uint256 indexed callId, address indexed voter, int8 vote)
    - event: Followed(address indexed follower, address indexed followee)
    - event: NameSet(address indexed user, string name)
    - event: Unfollowed(address indexed follower, address indexed followee)
